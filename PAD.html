<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plan de Acción Diario</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Archivo+Narrow:wght@400;500;600&display=swap');

  :root{
    --pink:#CC5A6E;
    --ink:#221F1F;
    --gray-bg:#F0F1F1;
    --line:#221F1F;
    --line-light:#CFCFCF;
  }
  *{box-sizing:border-box;}
  body{
    background:#E9E9E7;
    font-family:'Archivo Narrow', sans-serif;
    color:var(--ink);
    margin:0;
    padding:24px 12px 60px;
  }
  .sheet{
    max-width:900px;
    margin:0 auto;
    background:#fff;
    padding:26px 34px 18px;
    position:relative;
  }
  .toolbar{
    max-width:900px;
    margin:0 auto 14px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
  }
  .toolbar button{
    font-family:'Archivo Narrow', sans-serif;
    font-size:13px;
    font-weight:600;
    border:1.5px solid var(--ink);
    background:#fff;
    color:var(--ink);
    padding:7px 14px;
    cursor:pointer;
    border-radius:3px;
    letter-spacing:.03em;
  }
  .toolbar button:hover{ background:var(--ink); color:#fff; }
  .toolbar button.primary{ background:var(--pink); border-color:var(--pink); color:#fff; }
  .toolbar button.primary:hover{ background:#b34558; }

  /* ===== Header ===== */
  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
  }
  h1{
    font-family:'Archivo', sans-serif;
    font-weight:800;
    font-size:34px;
    letter-spacing:.01em;
    margin:0;
    line-height:1;
    white-space:nowrap;
  }
  h1 .accent{ color:var(--pink); }
  .underline{
    width:190px;
    height:3px;
    background:var(--line-light);
    margin-top:10px;
  }
  .date-box{ text-align:center; min-width:230px; }
  .date-box .label{
    font-family:'Archivo Narrow';
    font-size:11px;
    letter-spacing:.15em;
    font-weight:600;
    margin-bottom:6px;
  }
  .dow-row{
    display:flex;
    border:1px solid var(--ink);
  }
  .dow-row div{
    flex:1;
    text-align:center;
    font-size:13px;
    font-weight:600;
    padding:6px 0;
    border-right:1px solid var(--ink);
    cursor:pointer;
    user-select:none;
  }
  .dow-row div:last-child{ border-right:none; }
  .dow-row div.selected{ background:var(--pink); color:#fff; }

  /* ===== Section labels ===== */
  .sec-title{
    font-family:'Archivo Narrow';
    font-size:11px;
    font-weight:700;
    letter-spacing:.13em;
    text-transform:uppercase;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:4px;
    margin:0 0 4px;
  }

  .main-grid{
    display:grid;
    grid-template-columns:1fr 240px;
    gap:0 24px;
    margin-top:16px;
  }
  .col-left{ display:flex; flex-direction:column; gap:12px; }
  .col-right{ display:flex; flex-direction:column; gap:10px; }

  /* Objetivos */
  .objetivos-list{ list-style:none; margin:0; padding:0; }
  .obj-row{
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--line-light);
    padding:5px 0;
  }
  .obj-num{ font-size:13px; font-weight:600; width:16px; }
  .obj-text{
    flex:1;
    outline:none;
    font-size:13px;
    padding:2px 4px;
    min-height:16px;
  }
  .obj-text:focus{ background:#fbeef0; }
  .chk{
    width:15px; height:15px;
    border:1.5px solid var(--ink);
    cursor:pointer;
    flex-shrink:0;
    position:relative;
  }
  .chk.checked{ background:var(--pink); border-color:var(--pink); }
  .chk.checked::after{
    content:'✓'; color:#fff; font-size:11px; font-weight:700;
    position:absolute; top:-2px; left:1.5px;
  }

  /* Tables (Lista de tareas / Rutina) */
  .task-table{ width:100%; border-collapse:collapse; }
  .task-table tr td{
    border-bottom:1px solid var(--line-light);
    padding:3.5px 6px;
    font-size:12.5px;
  }
  .task-table td.chk-cell{ width:24px; text-align:center; }
  .task-table td.num-cell{ width:20px; color:#8a8a8a; font-size:11px; text-align:right; padding-right:4px; user-select:none; }
  .task-table td.text-cell{ outline:none; }
  .task-table td.text-cell:focus{ background:#fbeef0; }

  /* Right column boxes */
  .box{
    background:var(--gray-bg);
    padding:7px 10px;
    min-height:44px;
    outline:none;
    font-size:12px;
    line-height:1.45;
  }
  .box:focus{ background:#e7e2e3; }

  .menu-item{ display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid var(--line-light); }
  .menu-item:last-of-type{ border-bottom:none; }
  .menu-letter{ font-family:'Archivo'; font-weight:800; font-size:19px; width:22px; text-align:center; }
  .menu-sub{ display:flex; flex-direction:column; }
  .menu-sub .cap{ font-size:8px; letter-spacing:.1em; color:#8a8a8a; text-transform:uppercase; }
  .menu-text{ flex:1; outline:none; font-size:12px; border-bottom:1px solid var(--line-light); padding:2px 2px; min-height:14px; }
  .menu-text:focus{ background:#fbeef0; }

  .agua-row{ display:flex; align-items:center; gap:8px; padding-top:4px; }
  .agua-label{ font-size:11px; font-weight:600; width:32px; }
  .cups{ display:flex; gap:4px; }
  .cup{ width:14px; height:17px; border:1.5px solid var(--ink); border-top:none; cursor:pointer; clip-path:polygon(15% 0,85% 0,100% 100%,0 100%); }
  .cup.filled{ background:var(--pink); border-color:var(--pink); }

  .meet-row{ display:flex; align-items:center; gap:8px; padding:3.5px 0; border-bottom:1px solid var(--line-light); }
  .meet-row:last-child{ border-bottom:none; }
  .meet-time{ width:42px; font-size:11px; outline:none; border-bottom:1px dotted var(--line-light); text-align:center; }
  .meet-time:focus{ background:#fbeef0; }
  .meet-text{ flex:1; outline:none; font-size:11.5px; border-bottom:1px solid var(--line-light); padding:2px 2px; min-height:14px; }
  .meet-text:focus{ background:#fbeef0; }

  .notas-box{ min-height:100px; }

  .footer-logo{ display:flex; justify-content:flex-end; align-items:center; margin-top:8px; }
  .footer-logo img{ width:118px; height:auto; }

  @page{ size:letter portrait; margin:10mm; }
  @media print{
    body{ background:#fff; padding:0; }
    .toolbar{ display:none; }
    .sheet{ box-shadow:none; padding:0; max-width:100%; }
    .box, .obj-text:focus, .text-cell:focus, .menu-text:focus, .meet-text:focus{ background:transparent !important; }
  }
  @media (max-width:640px){
    .main-grid{ grid-template-columns:1fr; }
    h1{ font-size:28px; }
    .header{ flex-direction:column; gap:14px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="clearAll()">Limpiar todo</button>
  <button class="primary" onclick="window.print()">Imprimir / Guardar PDF</button>
</div>

<div class="sheet" id="sheet">

  <div class="header">
    <div>
      <h1>PLAN DE <span class="accent">ACCIÓN</span> DIARIO</h1>
      <div class="underline"></div>
    </div>
    <div class="date-box">
      <div class="label">FECHA</div>
      <div class="dow-row" id="dowRow">
        <div data-d="L">L</div><div data-d="M">M</div><div data-d="X">X</div>
        <div data-d="J">J</div><div data-d="V">V</div><div data-d="S">S</div><div data-d="D">D</div>
      </div>
    </div>
  </div>

  <div class="main-grid">
    <div class="col-left">

      <div>
        <div class="sec-title">3 Objetivos para hoy</div>
        <ul class="objetivos-list" id="objList"></ul>
      </div>

      <div>
        <div class="sec-title">Lista de tareas</div>
        <table class="task-table"><tbody id="tareasBody"></tbody></table>
      </div>

      <div>
        <div class="sec-title">Rutina diaria</div>
        <table class="task-table"><tbody id="rutinaBody"></tbody></table>
      </div>

      <div>
        <div class="sec-title">Post trabajo</div>
        <table class="task-table"><tbody id="postBody"></tbody></table>
      </div>

    </div>

    <div class="col-right">

      <div>
        <div class="sec-title">Me lo merezco</div>
        <div class="box" contenteditable="true" data-key="merezco"></div>
      </div>

      <div>
        <div class="sec-title">Menú</div>
        <div class="menu-item">
          <div class="menu-letter">D</div>
          <div class="menu-sub" style="flex:1">
            <span class="cap">Desayuno</span>
            <div class="menu-text" contenteditable="true" data-key="desayuno"></div>
          </div>
        </div>
        <div class="menu-item">
          <div class="menu-letter">C</div>
          <div class="menu-sub" style="flex:1">
            <span class="cap">Comida</span>
            <div class="menu-text" contenteditable="true" data-key="comida"></div>
          </div>
        </div>
        <div class="menu-item">
          <div class="menu-letter">C</div>
          <div class="menu-sub" style="flex:1">
            <span class="cap">Cena</span>
            <div class="menu-text" contenteditable="true" data-key="cena"></div>
          </div>
        </div>
        <div class="agua-row">
          <div class="agua-label">Agua</div>
          <div class="cups" id="cupsRow"></div>
        </div>
      </div>

      <div>
        <div class="sec-title">Ejercicio + Salud</div>
        <div class="box" contenteditable="true" data-key="ejercicio"></div>
      </div>

      <div>
        <div class="sec-title">Reuniones + Citas</div>
        <div id="meetList"></div>
      </div>

      <div>
        <div class="sec-title">Notas</div>
        <div class="box notas-box" contenteditable="true" data-key="notas"></div>
      </div>

    </div>
  </div>

<script>
// ---------- build repeated rows ----------
function buildTable(bodyId, rows, prefix, numbered){
  const tbody = document.getElementById(bodyId);
  for(let i=0;i<rows;i++){
    const tr = document.createElement('tr');
    const numCell = numbered ? `<td class="num-cell">${i+1}</td>` : '';
    tr.innerHTML = `${numCell}<td class="chk-cell"><div class="chk" data-key="${prefix}chk${i}"></div></td>
                     <td class="text-cell" contenteditable="true" data-key="${prefix}txt${i}"></td>`;
    tbody.appendChild(tr);
  }
}
buildTable('tareasBody', 12, 'tarea', true);
buildTable('rutinaBody', 7, 'rutina', false);
buildTable('postBody', 3, 'post', false);

// objetivos
const objList = document.getElementById('objList');
for(let i=1;i<=3;i++){
  const li = document.createElement('li');
  li.className='obj-row';
  li.innerHTML = `<span class="obj-num">${i}.</span>
                   <div class="obj-text" contenteditable="true" data-key="obj${i}"></div>
                   <div class="chk" data-key="objchk${i}"></div>`;
  objList.appendChild(li);
}

// cups
const cupsRow = document.getElementById('cupsRow');
for(let i=0;i<8;i++){
  const c = document.createElement('div');
  c.className='cup';
  c.dataset.key = 'cup'+i;
  cupsRow.appendChild(c);
}

// meetings
const meetList = document.getElementById('meetList');
for(let i=0;i<7;i++){
  const row = document.createElement('div');
  row.className='meet-row';
  row.innerHTML = `<div class="meet-time" contenteditable="true" data-key="meettime${i}">:</div>
                    <div class="meet-text" contenteditable="true" data-key="meettxt${i}"></div>`;
  meetList.appendChild(row);
}

// ---------- checkbox toggling ----------
document.querySelectorAll('.chk').forEach(chk=>{
  chk.addEventListener('click', ()=>{
    chk.classList.toggle('checked');
    save();
  });
});
document.querySelectorAll('.cup').forEach(cup=>{
  cup.addEventListener('click', ()=>{
    cup.classList.toggle('filled');
    save();
  });
});
document.querySelectorAll('.dow-row div').forEach(d=>{
  d.addEventListener('click', ()=>{
    document.querySelectorAll('.dow-row div').forEach(x=>x.classList.remove('selected'));
    d.classList.add('selected');
    save();
  });
});

// ---------- persistence (localStorage) ----------
const STORAGE_KEY = 'planAccionDiario';
function save(){
  const data = {};
  document.querySelectorAll('[data-key]').forEach(el=>{
    if(el.classList.contains('chk')){
      data[el.dataset.key] = el.classList.contains('checked');
    } else if(el.classList.contains('cup')){
      data[el.dataset.key] = el.classList.contains('filled');
    } else if(el.classList.contains('dow-row') || el.parentElement && el.parentElement.id==='dowRow'){
      // handled separately
    } else {
      data[el.dataset.key] = el.innerText;
    }
  });
  const selectedDow = document.querySelector('.dow-row .selected');
  data['dow'] = selectedDow ? selectedDow.dataset.d : '';
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
}
function load(){
  let data;
  try{ data = JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){ data=null; }
  if(!data) return;
  document.querySelectorAll('[data-key]').forEach(el=>{
    const v = data[el.dataset.key];
    if(v===undefined) return;
    if(el.classList.contains('chk')){
      el.classList.toggle('checked', !!v);
    } else if(el.classList.contains('cup')){
      el.classList.toggle('filled', !!v);
    } else {
      el.innerText = v;
    }
  });
  if(data.dow){
    const el = document.querySelector(`.dow-row [data-d="${data.dow}"]`);
    if(el) el.classList.add('selected');
  }
}
document.querySelectorAll('[contenteditable]').forEach(el=>{
  el.addEventListener('input', save);
  el.addEventListener('blur', save);
});
function clearAll(){
  if(!confirm('¿Borrar todo el contenido del plan?')) return;
  document.querySelectorAll('[contenteditable]').forEach(el=> el.innerText='');
  document.querySelectorAll('.chk').forEach(el=> el.classList.remove('checked'));
  document.querySelectorAll('.cup').forEach(el=> el.classList.remove('filled'));
  document.querySelectorAll('.dow-row div').forEach(el=> el.classList.remove('selected'));
  save();
}
load();
</script>
